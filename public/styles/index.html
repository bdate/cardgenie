<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Card Art Styles – Watercolor, Storybook, Pencil &amp; More | Card Genie</title>
    <meta name="description" content="See how each Card Genie art style looks on the same greeting-card scene, from watercolor and storybook to pencil, papercut, and vintage." />
    <link rel="canonical" href="https://www.card-genie.com/styles/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Card Genie" />
    <meta property="og:title" content="Card Art Styles – Watercolor, Storybook, Pencil &amp; More | Card Genie" />
    <meta property="og:description" content="See how each Card Genie art style looks on the same greeting-card scene, from watercolor and storybook to pencil, papercut, and vintage." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #315f5b;
        --dark-teal: #3f9b91;
        --orange: #f59e33;
        --cream: #fff8ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 10%, rgba(245, 158, 51, 0.28), transparent 34%),
          radial-gradient(circle at 85% 4%, rgba(143, 208, 201, 0.36), transparent 30%),
          linear-gradient(135deg, #fff8ef 0%, #f3fbfa 48%, #eef3ff 100%);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 36px 20px 80px;
      }

      h1 {
        margin: 18px 0 10px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .intro {
        max-width: 640px;
        margin: 0 0 32px;
        color: #666;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(63, 155, 145, 0.2);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 18px 44px rgba(63, 155, 145, 0.12);
      }

      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        background: #efe7db;
      }

      figcaption {
        display: grid;
        gap: 6px;
        padding: 12px 14px 14px;
      }

      figcaption strong {
        font-size: 0.92rem;
        line-height: 1.25;
      }

      .tag {
        width: fit-content;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .tag-photo {
        color: #7a4a12;
        background: rgba(245, 158, 51, 0.18);
      }

      .tag-likeness {
        color: var(--dark-teal);
        background: rgba(143, 208, 201, 0.28);
      }
      .use-style {
        width: fit-content;
        margin-top: 4px;
        border-radius: 999px;
        padding: 7px 14px;
        color: #fff;
        background: var(--orange);
        font-size: 0.82rem;
        font-weight: 800;
        text-decoration: none;
      }

      .use-style:hover,
      .use-style:focus-visible {
        background: #e9821f;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/brand-header.css" />
  </head>
  <body>
    <main>
      <header class="cg-header">
        <a class="cg-brand" href="/" aria-label="Card Genie home"><img src="/logo-mark.png" alt="" width="72" height="72" /><span>Card Genie</span></a>
        <a class="cg-powered" href="https://www.greetingcarduniverse.com" target="_blank" rel="noreferrer">Powered by GreetingCardUniverse.com</a>
      </header>
      <h1>Style lookbook</h1>
      <p class="intro">
        Same garden scene, fifteen treatments. Photorealistic is the photo-like look. Every other style keeps a
        resemblance in its own medium, not a replica of the photo.

      <div class="gallery">
        <figure>
          <img src="./style-photorealistic.webp" alt="Photorealistic warm portrait photography sample" loading="eager" />
          <figcaption>
            <span class="tag tag-photo">Photo-like</span>
            <strong>Photorealistic warm portrait photography</strong>
            <a class="use-style" href="/?style=Photorealistic%20warm%20portrait%20photography">Use this style</a>

        </figure>

        <figure>

          <figcaption>

        <figure>

    </main>
