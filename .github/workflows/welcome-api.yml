name: Deploy welcome experiment API

on:
  push:
    branches: [main]
    paths:
      - worker/landing-experiment.js
      - .github/workflows/welcome-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: welcome-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify routing and purchase attribution
        run: node --test tests/welcome.test.mjs
      - name: Deploy existing API with welcome experiment support
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 945874cb1a5ca1455d9630e8af8ce43d
