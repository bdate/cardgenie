<style>
/* Envelope/card reveal, mirrored from ~/Documents/gcu-inside/animation_template.html. */
:root {
  --gcu-orange: #f59e33;
  --gcu-teal: #8fd0c9;
  --gcu-dark-teal: #3f9b91;
  --gcu-grey: #7d7d7d;
  --gcu-dark-grey: #666666;
  --gcu-ink: #315f5b;
  --card-cover-width: 5;
  --card-cover-height: 7;
  color: var(--gcu-ink);
  background:
    radial-gradient(circle at 15% 10%, rgba(245, 158, 51, 0.34), transparent 34%),
    radial-gradient(circle at 85% 4%, rgba(143, 208, 201, 0.4), transparent 30%),
    linear-gradient(135deg, #fff8ef 0%, #f3fbfa 48%, #eef3ff 100%);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { min-height: 100vh; margin: 0; display: grid; place-items: center; align-content: center; padding: 24px 16px; }
main { position: relative; width: min(680px, 100%); }
button { font: inherit; }

.proof-stage { min-height: 530px; }

.envelope-scene, .card-reveal {
  display: grid; place-items: center; justify-items: center;
  width: 100%; max-width: 100%; border: 0; border-radius: 30px;
  padding: 96px 40px 24px;
  background:
    radial-gradient(circle at top, rgba(245, 158, 51, 0.28), transparent 35%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(143, 208, 201, 0.22));
  cursor: pointer; perspective: 1400px;
}
.envelope-scene { position: relative; grid-template-rows: 320px auto; align-content: center; row-gap: 22px; }
.envelope-scene .envelope { grid-row: 1; }
.opening-stack { position: relative; grid-row: 1; width: min(520px, 88vw); height: 320px; isolation: isolate; }
.opening-stack .envelope { width: 100%; height: 100%; }

.envelope {
  --envelope-paper:
    linear-gradient(32deg, transparent 49.6%, rgba(63, 155, 145, 0.15) 50%, transparent 50.7%),
    linear-gradient(-32deg, transparent 49.6%, rgba(63, 155, 145, 0.15) 50%, transparent 50.7%),
    linear-gradient(145deg, #fff8ef, #eaf8f6);
  --envelope-lining: linear-gradient(145deg, #e7ecea, #ccd4d1);
  --envelope-inside: linear-gradient(145deg, #f4f6f5, #e6ebe9);
  position: relative; width: min(520px, 88vw); height: 320px;
  transform-style: preserve-3d;
  box-shadow: 0 26px 35px rgba(63, 155, 145, 0.22);
  animation: floatIn 700ms ease both;
}
.envelope-static { animation: none; }
.envelope-front-face, .envelope-back, .envelope-body, .envelope-flap, .envelope-liner { position: absolute; inset: 0; }
.envelope-front-face {
  z-index: 2; display: grid; place-items: center; align-content: center; color: var(--gcu-ink);
  background: radial-gradient(circle at 78% 20%, rgba(245, 158, 51, 0.1), transparent 22%), linear-gradient(145deg, #fff8ef, #eaf8f6);
  box-shadow: inset 0 0 0 1px rgba(63, 155, 145, 0.18);
  backface-visibility: hidden;
}
.envelope.is-flipping { animation: none; }
.envelope.is-flipping .envelope-front-face { animation: envelopeFrontFlipOut 2.4s cubic-bezier(0.18, 0.82, 0.22, 1) both; }
.envelope.is-flipping .envelope-front-address, .envelope.is-flipping .envelope-from { animation: frontAddressFlipCutoff 2.4s linear both; }
.envelope-from {
  position: absolute; z-index: 3; top: 36px; left: 38px; max-width: 42%;
  color: var(--gcu-ink); font-size: 0.82rem; font-weight: 700; line-height: 1.25; text-align: left;
  transform: translateZ(1px);
}
.envelope-front-address {
  max-width: 68%; font-family: "Playfair Display", Georgia, serif; font-size: clamp(2rem, 4vw, 2.5rem);
  line-height: 1.12; text-align: center; text-wrap: balance; overflow-wrap: anywhere; grid-area: 1 / 1;
}
.envelope-front-address.is-medium { max-width: 62%; font-size: clamp(1.45rem, 3.1vw, 1.85rem); }
.envelope-front-address.is-long { max-width: 58%; font-size: clamp(1.15rem, 2.5vw, 1.45rem); }
.envelope-stamp {
  position: absolute; top: 18px; right: 22px; width: 82px; height: auto; object-fit: contain;
  filter: drop-shadow(0 8px 12px rgba(22, 39, 43, 0.14)); pointer-events: none;
}
.envelope-prompt {
  display: inline-flex; grid-row: 2; color: var(--gcu-dark-teal);
  font-size: 1rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase;
}
.envelope-prompt-placeholder { visibility: hidden; }
.envelope-back { z-index: 0; background: var(--envelope-paper); box-shadow: inset 0 0 0 1px rgba(63, 155, 145, 0.18); }
.envelope-back-face {
  position: absolute; inset: 0; z-index: 2; display: grid; place-items: center;
  background: var(--envelope-paper); box-shadow: inset 0 0 0 1px rgba(63, 155, 145, 0.18);
  transform: rotateY(180deg); transform-style: preserve-3d; backface-visibility: hidden;
}
.envelope-back-face .envelope-back, .envelope-back-face .envelope-flap,
.envelope-back-face .envelope-liner, .envelope-back-face .envelope-body { transform: none; }
.envelope.is-flipping .envelope-back-face { animation: envelopeBackFlipIn 2.4s cubic-bezier(0.18, 0.82, 0.22, 1) both; transform: none; }
.envelope-back-face.is-static { transform: none; }
.envelope-body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; z-index: 1;
  background: var(--envelope-paper); box-shadow: inset 0 0 0 1px rgba(63, 155, 145, 0.18);
}
.envelope.is-opening .envelope-body { z-index: 6; background: transparent; box-shadow: none; animation: backEnvelopeLayerReveal 9s linear both; }
.envelope-liner {
  z-index: 3; clip-path: polygon(0 0, 50% 62%, 100% 0); background: var(--envelope-inside); pointer-events: none;
}
.envelope-flap {
  z-index: 4; clip-path: polygon(0 0, 50% 62%, 100% 0); background: var(--envelope-lining);
  transform-origin: top center; animation: flapPeek 2.2s ease-in-out infinite;
}
.envelope-flap-static { animation: none; }
.opening-scene { position: relative; overflow: visible; cursor: default; }
.opening-scene .envelope { z-index: 3; animation: envelopeOpenAndFade 4.6s ease forwards; }
.envelope.is-opening .envelope-flap { z-index: 6; transform: translateZ(0px); animation: flapOpen 4.6s cubic-bezier(0.2, 0.9, 0.2, 1) forwards; }
.envelope.is-opening .envelope-back-face, .envelope.is-opening .envelope-liner { animation: envelopeLayerFade 4.6s ease forwards; }
.envelope.is-opening .envelope-back, .envelope.is-opening .envelope-back-face,
.envelope.is-opening .envelope-liner, .envelope.is-opening .envelope-body { backface-visibility: hidden; transform: none; }
.card-cover-frame img, .open-card img { display: block; width: 100%; height: 100%; object-fit: cover; }

.card-reveal { gap: 0; color: var(--gcu-dark-grey); font-weight: 900; }
.front-reveal, .card-open-scene.is-static-inside { min-height: auto; padding: 24px 16px; place-items: center; align-content: center; }
.card-cover-frame {
  position: relative; overflow: hidden; width: min(450px, 100%); margin-inline: auto;
  aspect-ratio: var(--card-cover-width) / var(--card-cover-height);
  box-shadow: 0 44px 96px rgba(63, 155, 145, 0.3), 0 0 0 1px rgba(63, 155, 145, 0.12);
  animation: slideFromEnvelope 620ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
}
.card-cover-frame img { background: #f9f6f0; }
.card-cover-frame.is-return { animation: none; }
.open-card {
  overflow: hidden; width: min(450px, 100%); aspect-ratio: var(--card-cover-width) / var(--card-cover-height);
  margin: 0 auto; border: 1px solid rgba(63, 155, 145, 0.2); background: #fff;
  box-shadow: 0 44px 96px rgba(63, 155, 145, 0.3), 0 0 0 1px rgba(63, 155, 145, 0.12);
  transform-origin: left center; animation: openBook 720ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
}
.card-open-scene {
  display: grid; place-items: center; width: 100%; border: 0; padding: 48px 28px; border-radius: 30px;
  color: inherit;
  background:
    radial-gradient(circle at top, rgba(245, 158, 51, 0.22), transparent 35%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(143, 208, 201, 0.2));
  cursor: pointer; perspective: 1600px;
}
.card-view-toggle {
  display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px;
  color: var(--gcu-grey); font-size: 0.92rem; font-weight: 850;
}
.card-view-toggle button {
  border: 0; padding: 0; color: var(--gcu-dark-teal); background: transparent; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
.card-view-toggle button.is-selected { color: var(--gcu-ink); text-decoration: none; cursor: default; }

@keyframes floatIn { from { opacity: 0; transform: translateY(26px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes envelopeOpenAndFade {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  28% { opacity: 1; transform: translateY(0) scale(1); }
  66% { opacity: 1; transform: translateY(34px) scale(0.99); }
  78% { opacity: 1; transform: translateY(48px) scale(0.98); }
  100% { opacity: 1; transform: translateY(86px) scale(0.96); }
}
@keyframes envelopeLayerFade { 0%, 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes envelopeFrontFlipOut {
  0% { opacity: 1; visibility: visible; transform: perspective(1200px) rotateY(0deg) scaleX(1); }
  49.9% { opacity: 1; visibility: visible; transform: perspective(1200px) rotateY(82deg) scaleX(0.04); }
  50%, 100% { opacity: 0; visibility: hidden; transform: perspective(1200px) rotateY(90deg) scaleX(0.02); }
}
@keyframes envelopeBackFlipIn {
  0%, 49.9% { opacity: 0; visibility: hidden; transform: perspective(1200px) rotateY(-90deg) scaleX(0.02); }
  50% { opacity: 1; visibility: visible; transform: perspective(1200px) rotateY(-82deg) scaleX(0.04); }
  100% { opacity: 1; visibility: visible; transform: perspective(1200px) rotateY(0deg) scaleX(1); }
}
@keyframes frontAddressFlipCutoff { 0%, 29% { visibility: visible; opacity: 1; } 29.1%, 100% { visibility: hidden; opacity: 0; } }
@keyframes backEnvelopeLayerReveal { 0%, 14.9% { visibility: hidden; opacity: 0; } 15%, 100% { visibility: visible; opacity: 1; } }
@keyframes flapPeek { 0%, 100% { transform: rotateX(0deg); } 50% { transform: rotateX(16deg); } }
@keyframes flapOpen {
  0% { opacity: 1; transform: rotateX(0deg) translateZ(0px); }
  36% { opacity: 1; transform: rotateX(118deg) translateY(-8px) translateZ(0px); }
  78% { opacity: 1; transform: rotateX(118deg) translateY(-8px) translateZ(0px); }
  100% { opacity: 0; transform: rotateX(118deg) translateY(-8px) translateZ(0px); }
}
@keyframes slideFromEnvelope { from { opacity: 0; transform: translateY(80px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes openBook {
  from { opacity: 0; transform: perspective(1000px) rotateY(-5deg) scale(0.96); }
  to { opacity: 1; transform: perspective(1000px) rotateY(0deg) scale(1); }
}

/* The card slides out from inside the envelope: a sleeve (clipped at the envelope's bottom edge)
   holds the card, and a pocket layer with the envelope's V opening sits in front of it. Both ride
   along with the envelope's drop. Portrait cards are taller than the envelope, so they start lower
   and travel further. --card-w is shared with the cover/inside views so the card never resizes. */
body { --card-w: 64%; --rise-start: 42%; --rise-peek: 36%; --rise-near: -46%; --rise-end: -50%; }
body.is-landscape { --card-w: 90%; --rise-start: 14%; --rise-peek: 10%; --rise-near: -72%; --rise-end: -76%; }
.card-sleeve, .envelope-pocket {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
  animation: envelopeOpenAndFade 4.6s ease forwards;
}
.card-sleeve { top: -200%; z-index: 5; overflow: hidden; }
.envelope-pocket {
  --envelope-paper:
    linear-gradient(32deg, transparent 49.6%, rgba(63, 155, 145, 0.15) 50%, transparent 50.7%),
    linear-gradient(-32deg, transparent 49.6%, rgba(63, 155, 145, 0.15) 50%, transparent 50.7%),
    linear-gradient(145deg, #fff8ef, #eaf8f6);
  top: 0; z-index: 7; background: var(--envelope-paper);
  clip-path: polygon(0 0, 50% 62%, 100% 0, 100% 100%, 0 100%);
  filter: drop-shadow(0 -1px 0 rgba(63, 155, 145, 0.18));
}
.sleeve-card {
  position: absolute; left: 50%; bottom: 6px; width: var(--card-w);
  aspect-ratio: var(--card-cover-width) / var(--card-cover-height);
  background: #fff; box-shadow: 0 18px 40px rgba(63, 155, 145, 0.22);
  animation: cardSlideOut 4.6s cubic-bezier(0.3, 0.8, 0.25, 1) forwards;
}
.sleeve-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
@keyframes cardSlideOut {
  0%, 22% { opacity: 0; transform: translateX(-50%) translateY(var(--rise-start)); }
  30% { opacity: 1; transform: translateX(-50%) translateY(var(--rise-peek)); }
  84% { opacity: 1; transform: translateX(-50%) translateY(var(--rise-near)); }
  100% { opacity: 1; transform: translateX(-50%) translateY(var(--rise-end)); }
}
.card-cover-frame, .open-card {
  width: min(100%, calc((100svh - var(--card-reserve, 150px)) * var(--card-cover-width) / var(--card-cover-height)));
}
.envelope-ghost { position: absolute; margin: 0; z-index: 1; pointer-events: none; }

@media (max-width: 640px) {
  .envelope-scene { padding: 56px 16px 20px; grid-template-rows: 220px auto; }
  .envelope, .opening-stack { height: 220px; }
  .envelope-from { top: 22px; left: 22px; }
  .envelope-stamp { width: 60px; }
}

}
.gcu-loading h1 {
  margin: 10px 0 0; font-family: "Playfair Display", Georgia, serif; font-size: clamp(1.4rem, 4vw, 2rem);

}
.gcu-title { margin: 0; max-width: 34ch; color: var(--gcu-dark-grey); font-size: 0.86rem; font-weight: 600; min-height: 1.3em; }
.gcu-status { margin: 4px 0 0; color: var(--gcu-grey); font-size: 0.78rem; letter-spacing: 0.04em; }

.gcu-orbit { position: relative; width: 84px; height: 84px; }

.gcu-orbit::before { border: 6px solid rgba(143, 208, 201, 0.35); }

  animation: gcuSpin 900ms linear infinite;

  background: linear-gradient(145deg, #fff8ef, #eaf8f6); box-shadow: inset 0 0 0 1px rgba(63, 155, 145, 0.25);
  animation: gcuPulse 1.6s ease-in-out infinite;

.gcu-orbit span::before { content: ""; width: 60%; height: 2px; background: var(--gcu-dark-teal); box-shadow: 0 6px 0 var(--gcu-teal), 0 -6px 0 var(--gcu-teal); }
@keyframes gcuSpin { to { transform: rotate(360deg); } }
@keyframes gcuPulse { 0%, 100% { transform: scale(0.92); } 50% { transform: scale(1.04); } }

  border-radius: 999px; background: var(--gcu-orange); color: #fff; font-size: 1.05rem; font-weight: 900; text-decoration: none;
  box-shadow: 0 10px 22px rgba(245, 158, 51, 0.32);

.gift-buy .gift-buy-links { margin: 12px auto 0; font-size: 0.88rem; line-height: 1.9; }

.gift-buy .gift-buy-fine { margin: 6px auto 0; color: var(--gcu-grey); font-size: 0.8rem; white-space: nowrap; }
.gift-buy .nowrap { white-space: nowrap; }
.gcu-footer { margin-top: 18px; text-align: center; font-size: 0.78rem; color: var(--gcu-grey); }

.gcu-back { display: inline-block; margin: 0 0 12px; border: 0; padding: 0; background: none; color: var(--gcu-dark-teal); font-size: 0.86rem; font-weight: 700; cursor: pointer; }

<script>
const PID = "__PID__";
const API_ORIGIN = "__API__";
const APP_URL = "__APP__";
const API = `${API_ORIGIN}/gcu/${PID}`;
const KNOWN_TITLE = "__TITLE__";
const KNOWN_INFO = "__INFO__";
const GIFT_ID = (new URLSearchParams(location.search).get("s") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 24);
const stage = document.getElementById("stage");
const after = document.getElementById("after");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Progress screen ----------
function showLoader(heading = `Creating animation for GCU Card# ${PID}`, title = KNOWN_TITLE) {
  document.body.classList.remove("product-mode");
  document.documentElement.classList.remove("product-mode");
  after.innerHTML = "";
  stage.innerHTML = `
    <section class="gcu-loading" aria-live="polite">
      <div class="gcu-orbit" aria-hidden="true"><span></span></div>
      <h1>${esc(heading)}</h1>
      <p class="gcu-title">${esc(title)}</p>
      <p class="gcu-status">Finding the card…</p>
    </section>`;
}
const setTitle = (t) => { const el = stage.querySelector(".gcu-title"); if (el && t) el.textContent = t; };
const setStatus = (t, error = false) => {
  if (error && /failed to fetch|load failed|networkerror/i.test(t)) t = "Couldn’t connect. Check your connection and try again.";
  const el = stage.querySelector(".gcu-status");
  if (!el) return;
  el.textContent = t;
  el.classList.toggle("gcu-error", error);
  if (error) stage.querySelector(".gcu-orbit")?.remove();
};
if (KNOWN_TITLE) document.title = `${KNOWN_TITLE} · GCU ${PID}`;

// ---------- Inside image (port of gcu-inside/gcu_card.py) ----------
// GCU's supported inside fonts, each drawn with the closest freely available web font.
const FONTS = {
  "Arial": { family: "Arimo" },
  "Avant Garde": { family: "Questrial" },
  "BernhardFashion BT": { family: "Poiret One" },
  "BibleScrT": { family: "Courgette" },
  "Comic Sans": { family: "Comic Neue" },
  "Curlz": { family: "Emilys Candy" },
  "Edwardian": { family: "Pinyon Script" },
  "Efflorescence": { family: "Kalam" },
  "Felt Tip Roman": { family: "Gochi Hand" },
  "Freehand591": { family: "Yellowtail" },
  "Helvetica Neue CN": { family: "Roboto Condensed" },
  "Jokerman": { family: "Chewy" },
  "Marydale": { family: "Patrick Hand" },
  "Optima": { family: "Tenor Sans" },
  "Snell Roundhand": { family: "Great Vibes" },
  "Times New Roman": { family: "Tinos" },
};
const PRINT_LONG = 2100, PRINT_SHORT = 1500;
const fontCss = (name, px) => {
  const f = FONTS[name];
  return `${f.style || "normal"} ${f.weight || 400} ${px}px "${f.family}"`;
};
// On www the page is written in by script, so the Google Fonts sheet may still be loading here (and
// its load event never fires); until it's applied, document.fonts.load() knows no faces and canvas
// silently falls back to a default font.
const knownFamilies = () => new Set([...document.fonts].map((f) => f.family.replace(/"/g, "")));
const fontRulesReady = async () => {
  for (let waited = 0; waited < 8000; waited += 50) {
    const known = knownFamilies();
    if (Object.values(FONTS).every((f) => known.has(f.family))) return;
    await new Promise((r) => setTimeout(r, 50));
  }
};
const loadFonts = async () => {
  await fontRulesReady();
  await Promise.all(Object.keys(FONTS).map((n) => document.fonts.load(fontCss(n, 40), "Happy Birthday"))).catch(() => {});
  const loaded = new Set([...document.fonts].filter((f) => f.status === "loaded").map((f) => f.family.replace(/"/g, "")));
  // Canvas can still draw a just-loaded face with the fallback font until it has been used once
  // and a frame has passed.
  const ctx = sized(400, 80);
  for (const n of Object.keys(FONTS)) { ctx.font = fontCss(n, 40); ctx.fillText("Happy Birthday", 0, 60); }
  ctx.getImageData(0, 0, 1, 1);
  await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
  return Object.values(FONTS).every((f) => loaded.has(f.family));
};

const loadImage = (src, cors = false) => new Promise((resolve, reject) => {
  const img = new Image();
  if (cors) img.crossOrigin = "anonymous";
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error("Couldn't load the card images. Please try again."));
  img.src = src;
});

const work = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
const sized = (w, h) => { work.canvas.width = w; work.canvas.height = h; return work; };

function messagePanel(img) {
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const ctx = sized(W0, H0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W0, H0); ctx.drawImage(img, 0, 0);
  const rgba = ctx.getImageData(0, 0, W0, H0).data;
  const gray = new Float32Array(W0 * H0);
  for (let i = 0; i < gray.length; i++) gray[i] = (rgba[i * 4] * 299 + rgba[i * 4 + 1] * 587 + rgba[i * 4 + 2] * 114) / 1000;
  // Portrait cards open left-right (message on the right half); landscape ones fold top-bottom.
  const landscape = H0 > W0;
  const tw = landscape ? H0 : W0, th = landscape ? W0 : H0;
  const at = (x, y) => (landscape ? gray[x * W0 + y] : gray[y * W0 + x]);
  const isRule = (x) => { let n = 0; for (let y = 0; y < th; y += 2) if (at(x, y) < 200) n++; return n > (th * 0.3) / 2; };
  let x0 = Math.floor(tw / 2);
  for (let x = Math.floor(tw * 0.4); x < Math.floor(tw * 0.6); x++) {
    if (isRule(x)) { x0 = x; while (x0 < tw && isRule(x0)) x0++; x0++; break; }
  }
  const [cx, cy, cw, ch] = landscape ? [0, x0, W0, H0 - x0] : [x0, 0, W0 - x0, H0];
  const pg = new Float32Array(cw * ch), prgb = new Uint8ClampedArray(cw * ch * 3);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const s = (y + cy) * W0 + x + cx, d = y * cw + x;
    pg[d] = gray[s]; prgb[d * 3] = rgba[s * 4]; prgb[d * 3 + 1] = rgba[s * 4 + 1]; prgb[d * 3 + 2] = rgba[s * 4 + 2];
  }
  return { landscape, panel: { w: cw, h: ch, gray: pg, rgb: prgb } };
}

function minOf(arr) { let m = 255; for (const v of arr) if (v < m) m = v; return m; }

// Ink boxes of each text line: slivers merge into neighbours, and blocks of touching lines are
// split at the emptiest rows until the count matches the page's text.
function lineBoxes(panel, expected) {
  const { w, h, gray } = panel;
  const threshold = (minOf(gray) + 255) / 2;
  const ink = new Uint8Array(w * h);
  const rowInk = new Array(h).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (gray[y * w + x] < threshold) { ink[y * w + x] = 1; rowInk[y]++; }
  const groups = [];
  let start = null;
  for (let y = 0; y <= h; y++) {
    const on = y < h && rowInk[y] > 0;
    if (on && start === null) start = y;
    else if (!on && start !== null) { groups.push([start, y]); start = null; }
  }
  if (!groups.length) return [];
  const tall = groups.map(([a, b]) => b - a).sort((p, q) => p - q)[Math.floor(groups.length / 2)];
  let merged = [];
  for (const g of groups) {
    if (merged.length && g[1] - g[0] < tall * 0.45) merged[merged.length - 1][1] = g[1];
    else merged.push([...g]);
  }
  while (merged.length > expected) {
    let i = 0;
    for (let k = 1; k < merged.length - 1; k++) if (merged[k + 1][0] - merged[k][1] < merged[i + 1][0] - merged[i][1]) i = k;
    merged[i][1] = merged.splice(i + 1, 1)[0][1];
  }
  if (merged.length < expected) {
    const heights = merged.map(([a, b]) => b - a);
    const pitch = heights.reduce((s, v) => s + v, 0) / expected;
    const counts = heights.map((hh) => Math.max(1, Math.round(hh / pitch)));
    const total = () => counts.reduce((s, v) => s + v, 0);
    while (total() !== expected) {
      const step = total() < expected ? 1 : -1;
      let k = -1, best = -Infinity;
      counts.forEach((c, j) => {
        const v = c + step >= 1 ? step * (heights[j] / pitch - c) : -Infinity;
        if (v > best) { best = v; k = j; }
      });
      if (k < 0) break;
      counts[k] += step;
    }
    const split = [];
    merged.forEach(([a, b], idx) => {
      const n = counts[idx], stepH = (b - a) / n;
      let prev = a;
      for (let j = 1; j < n; j++) {
        const guess = Math.round(a + j * stepH);
        const lo = Math.max(prev + 1, guess - Math.round(stepH * 0.3)), hi = Math.min(b - 1, guess + Math.round(stepH * 0.3));
        let cut = guess;
        if (lo <= hi) {
          cut = lo;
          for (let y = lo; y <= hi; y++) {
            if (rowInk[y] < rowInk[cut] || (rowInk[y] === rowInk[cut] && Math.abs(y - guess) < Math.abs(cut - guess))) cut = y;
          }
        }
        split.push([prev, cut]);
        prev = cut + 1;
      }
      split.push([prev, b]);
    });
    merged = split;
  }
  return merged.map(([a, b]) => {
    let x0 = w, x1 = 0;
    for (let y = a; y < b; y++) for (let x = 0; x < w; x++) if (ink[y * w + x]) { if (x < x0) x0 = x; if (x + 1 > x1) x1 = x + 1; }
    return x1 > x0 ? [x0, a, x1, b] : [0, a, w, b];
  });
}

function inkColor(panel, boxes) {
  const { w, gray, rgb } = panel;
  const picks = [];
  for (const [x0, y0, x1, y1] of boxes) {
    let darkest = 255;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) darkest = Math.min(darkest, gray[y * w + x]);
    const cut = darkest + (255 - darkest) * 0.25;
    const ch = [[], [], []];
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const i = y * w + x;
      if (gray[i] <= cut) for (let c = 0; c < 3; c++) ch[c].push(rgb[i * 3 + c]);
    }
    if (ch[0].length) picks.push(ch.map((v) => v.sort((p, q) => p - q)[Math.floor(v.length / 2)]));
  }
  if (!picks.length) return "#111111";
  const [r, g, b] = [0, 1, 2].map((c) => picks.map((p) => p[c]).sort((p, q) => p - q)[Math.floor(picks.length / 2)]);
  if (Math.max(r, g, b) < 60 && Math.max(r, g, b) - Math.min(r, g, b) < 20) return "#111111";
  return `#${[r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("")}`;
}

// Tight ink mask of one line (0-255). originX/baseline locate the text origin inside the mask.
function lineMask(name, text, px) {
  work.font = fontCss(name, px);
  const m = work.measureText(text);
  const left = Math.ceil(m.actualBoundingBoxLeft) + 4, asc = Math.ceil(m.actualBoundingBoxAscent) + 4;
  const w = Math.max(1, left + Math.ceil(m.actualBoundingBoxRight) + 4), h = Math.max(1, asc + Math.ceil(m.actualBoundingBoxDescent) + 4);
  const ctx = sized(w, h);
  ctx.font = fontCss(name, px);
  ctx.fillStyle = "#000";
  ctx.fillText(text, left, asc);
  const a = ctx.getImageData(0, 0, w, h).data;
  let bx0 = w, by0 = h, bx1 = 0, by1 = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3] > 0) {
    if (x < bx0) bx0 = x; if (y < by0) by0 = y; if (x >= bx1) bx1 = x + 1; if (y >= by1) by1 = y + 1;
  }
  if (bx1 <= bx0) { bx0 = 0; by0 = 0; bx1 = w; by1 = h; }
  const mw = bx1 - bx0, mh = by1 - by0, d = new Float32Array(mw * mh);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) d[y * mw + x] = a[((y + by0) * w + x + bx0) * 4 + 3];
  return { w: mw, h: mh, d, originX: left - bx0, baseline: asc - by0 };
}

const fitPx = (name, text, targetW, start = 40) => Math.max(4, Math.round((start * targetW) / Math.max(1, lineMask(name, text, start).w)));

function boxBlur(d, w, h) {
  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = Math.min(w - 1, Math.max(0, x + dx)), yy = Math.min(h - 1, Math.max(0, y + dy));
      s += d[yy * w + xx];
    }
    out[y * w + x] = s / 9;
  }
  return out;
}

// 0 = identical ink, 1 = no overlap. Masks are centred on a shared canvas, then nudged a couple of
// pixels to the best overlap, since preview text is only ~15px tall.
function overlayError(a, b) {
  const pad = 3, w = Math.max(a.w, b.w) + 2 * pad, h = Math.max(a.h, b.h) + 2 * pad;
  const place = (m) => {
    const out = new Float32Array(w * h), ox = Math.floor((w - m.w) / 2), oy = Math.floor((h - m.h) / 2);
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) out[(y + oy) * w + x + ox] = m.d[y * m.w + x];
    return boxBlur(out, w, h);
  };
  const ca = place(a), cb = place(b);
  let total = 0;
  for (let i = 0; i < ca.length; i++) total += ca[i] + cb[i];
  let best = Infinity;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    let s = 0;
    for (let y = 0; y < h; y++) {
      const sy = (((y - dy) % h) + h) % h;
      for (let x = 0; x < w; x++) s += Math.abs(ca[sy * w + ((((x - dx) % w) + w) % w)] - cb[y * w + x]);
    }
    if (s < best) best = s;
  }
  return best / Math.max(1, total);
}

function resizeMask(m, nw, nh) {
  const src = document.createElement("canvas");
  src.width = m.w; src.height = m.h;
  const sctx = src.getContext("2d");
  const img = sctx.createImageData(m.w, m.h);
  for (let i = 0; i < m.d.length; i++) img.data[i * 4 + 3] = m.d[i];
  sctx.putImageData(img, 0, 0);
  const ctx = sized(nw, nh);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, 0, 0, nw, nh);
  const a = ctx.getImageData(0, 0, nw, nh).data, d = new Float32Array(nw * nh);
  for (let i = 0; i < d.length; i++) d[i] = a[i * 4 + 3];
  return { w: nw, h: nh, d };
}

const SHEARS = Array.from({ length: 17 }, (_, i) => (i - 8) / 20);
// Horizontal shear that makes the strokes most vertical (0 upright, >0 leaning right).
function slant(m) {
  const { w, h, d } = m, pad = Math.round(h * 0.4), W2 = w + 2 * pad;
  let best = -1, bestK = 0;
  for (const k of SHEARS) {
    const cols = new Float32Array(W2);
    for (let y = 0; y < h; y++) {
      const shift = -k * (y + 0.5) - pad + (k * h) / 2;
      for (let x = 0; x < W2; x++) {
        const sx = x + 0.5 + shift - 0.5, x0 = Math.floor(sx), f = sx - x0;
        const v0 = x0 >= 0 && x0 < w ? d[y * w + x0] : 0, v1 = x0 + 1 >= 0 && x0 + 1 < w ? d[y * w + x0 + 1] : 0;
        cols[x] += v0 * (1 - f) + v1 * f;
      }
    }
    let peak = 0;
    for (const c of cols) peak += (c / h) * (c / h);
    if (peak > best) { best = peak; bestK = k; }
  }
  return bestK;
}

function cropTarget(panel, [x0, y0, x1, y1], gain) {
  const w = x1 - x0, h = y1 - y0, d = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) d[y * w + x] = Math.min(255, Math.round((255 - panel.gray[(y + y0) * panel.w + x + x0]) * gain));
  return { w, h, d };
}

function pickFont(panel, boxes, lines) {
  let widest = 0;
  boxes.forEach((b, i) => { if (b[2] - b[0] > boxes[widest][2] - boxes[widest][0]) widest = i; });
  // Full-strength ink should read as 255 whatever the colour, so light colours aren't mistaken for thin strokes.
  const gain = 255 / Math.max(1, 255 - minOf(panel.gray));
  const targets = boxes.map((b) => cropTarget(panel, b, gain));
  const targetSlant = targets.reduce((s, t) => s + slant(t), 0) / targets.length;
  const scores = {};
  for (const name of Object.keys(FONTS)) {
    const px = fitPx(name, lines[widest], boxes[widest][2] - boxes[widest][0]);
    // Drawn 4x larger and shrunk, like the site's own preview; drawing straight at ~15px lets the
    // browser's hinting distort the shapes enough to tip close calls.
    const masks = lines.map((t) => {
      const big = lineMask(name, t, px * 4);
      return resizeMask(big, Math.max(1, Math.round(big.w / 4)), Math.max(1, Math.round(big.h / 4)));
    });
    let err = 0;
    masks.forEach((m, i) => {
      const [x0, y0, x1, y1] = boxes[i], bw = x1 - x0, bh = y1 - y0;
      err += overlayError(m, targets[i]) + 0.5 * (Math.abs(m.w - bw) / bw + Math.abs(m.h - bh) / bh);
    });
    // Slant at preview size; italic vs upright is the clearest tell at ~15px.
    const fontSlant = masks.reduce((s, m, i) => {
      const bh = boxes[i][3] - boxes[i][1];
      return s + slant(resizeMask(m, Math.max(1, Math.round((m.w * bh) / Math.max(1, m.h))), bh));
    }, 0) / masks.length;
    scores[name] = [err / lines.length + 1.5 * Math.abs(fontSlant - targetSlant), px];
  }
  const best = Object.keys(scores).reduce((p, q) => (scores[q][0] < scores[p][0] ? q : p));
  return { font: best, px: scores[best][1] };
}

function alignment(boxes, panelW) {
  if (boxes.length < 2) {
    const c = (boxes[0][0] + boxes[0][2]) / 2;
    return Math.abs(c - panelW / 2) < panelW * 0.15 ? "center" : c < panelW / 2 ? "left" : "right";
  }
  const spread = (vals) => Math.max(...vals) - Math.min(...vals);
  const s = { left: spread(boxes.map((b) => b[0])), center: spread(boxes.map((b) => (b[0] + b[2]) / 2)), right: spread(boxes.map((b) => b[2])) };
  return Object.keys(s).reduce((p, q) => (s[q] < s[p] ? q : p));
}

function blankPage(landscape) {
  const c = document.createElement("canvas");
  c.width = landscape ? PRINT_LONG : PRINT_SHORT;
  c.height = landscape ? PRINT_SHORT : PRINT_LONG;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  return { c, ctx };
}

// Default layout when there's no preview to match: 22pt Times, centred a bit above the middle.
function renderDefault(lines, landscape) {
  const { c, ctx } = blankPage(landscape);
  const name = "Times New Roman", px = Math.round(22 * (300 / 72) * 0.95), pitch = px * 1.03;
  ctx.font = fontCss(name, px);
  const capH = ctx.measureText("H").actualBoundingBoxAscent;
  const top = 0.394 * c.height - (capH + pitch * (Math.max(1, lines.length) - 1)) / 2;
  ctx.fillStyle = "#111111"; ctx.textAlign = "center";
  lines.forEach((t, i) => ctx.fillText(t, 0.483 * c.width, top + capH + i * pitch));
  const style = { landscape, font: name, px, pitch, color: "#111111", align: "center", anchorX: 0.483 * c.width, midBaseline: top + capH + (pitch * (Math.max(1, lines.length) - 1)) / 2 };
  return { canvas: c, meta: { font: name, color: "#111111", align: "center" }, style };
}

function renderInside(preview, lines, frontLandscape) {
  const textLines = lines.filter(Boolean);
  if (!preview) return { ...renderDefault(textLines.length ? lines : [], frontLandscape), landscape: frontLandscape };
  const { landscape, panel } = messagePanel(preview);
  if (!textLines.length) return { ...renderDefault([], landscape), landscape };
  const boxes = lineBoxes(panel, textLines.length);
  if (boxes.length !== textLines.length) return { ...renderDefault(lines, landscape), landscape };
  const { font, px: previewPx } = pickFont(panel, boxes, textLines);
  const { c, ctx } = blankPage(landscape);
  const sx = c.width / panel.w, sy = c.height / panel.h, scale = (sx + sy) / 2;
  const align = alignment(boxes, panel.w), color = inkColor(panel, boxes);
  const px = Math.round(previewPx * scale);
  const masks = textLines.map((t) => lineMask(font, t, px));
  // Baselines are evenly spaced (blank lines count as a step), so fit one baseline grid to all
  // lines instead of trusting each line's ink centre, which ascenders and descenders pull around.
  const steps = [];
  lines.forEach((s, i) => { if (s) steps.push(i); });
  const seen = masks.map((m, i) => ((boxes[i][1] + boxes[i][3]) / 2) * sy - m.h / 2 + m.baseline);
  let baselines = seen;
  const n = steps.length;
  let pitch = px * 1.25;
  if (n > 1) {
    const ms = steps.reduce((s, v) => s + v, 0) / n, mb = seen.reduce((s, v) => s + v, 0) / n;
    pitch = steps.reduce((s, v, i) => s + (v - ms) * (seen[i] - mb), 0) / steps.reduce((s, v) => s + (v - ms) ** 2, 0);
    baselines = steps.map((s) => mb + pitch * (s - ms));
  }
  ctx.font = fontCss(font, px);
  ctx.fillStyle = color;
  masks.forEach((m, i) => {
    const [x0, , x1] = boxes[i];
    const left = align === "left" ? x0 * sx : align === "right" ? x1 * sx - m.w : ((x0 + x1) / 2) * sx - m.w / 2;
    ctx.fillText(textLines[i], left + m.originX, baselines[i]);
  });
  const anchorX = align === "left" ? Math.min(...boxes.map((b) => b[0])) * sx
    : align === "right" ? Math.max(...boxes.map((b) => b[2])) * sx
    : (boxes.reduce((s, b) => s + b[0] + b[2], 0) / (2 * boxes.length)) * sx;
  const style = { landscape, font, px, pitch: Math.max(px, Math.abs(pitch)), color, align, anchorX, midBaseline: (baselines[0] + baselines[n - 1]) / 2 };
  return { canvas: c, meta: { font, color, align }, landscape, style };
}

// A message the sender typed, laid out in the card's own font, colour, alignment and position.
// Long lines wrap; if it still doesn't fit, everything shrinks together.
const MAX_MESSAGE_CHARS = 400;
function renderCustom(style, message, signature) {
  const { c, ctx } = blankPage(style.landscape);
  const margin = c.width * 0.08, maxW = c.width - 2 * margin, top = c.height * 0.08, bottom = c.height * 0.92;
  const paragraphs = message.replace(/\r/g, "").split("\n").map((s) => s.replace(/\s+/g, " ").trim());
  while (paragraphs.length && !paragraphs[0]) paragraphs.shift();
  while (paragraphs.length && !paragraphs[paragraphs.length - 1]) paragraphs.pop();
  const sig = signature.replace(/\s+/g, " ").trim();
  let lines = [], px = style.px, pitch = style.pitch;
  for (let scale = 1; scale > 0.3; scale *= 0.92) {
    px = Math.max(8, Math.round(style.px * scale)); pitch = style.pitch * scale;
    ctx.font = fontCss(style.font, px);
    lines = [];
    for (const p of paragraphs) {
      if (!p) { lines.push(""); continue; }
      let line = "";
      for (const word of p.split(" ")) {
        const next = line ? `${line} ${word}` : word;
        if (line && ctx.measureText(next).width > maxW) { lines.push(line); line = word; } else line = next;
      }
      lines.push(line);
    }
    if (sig) lines.push("", sig);
    const widest = Math.max(0, ...lines.map((t) => ctx.measureText(t).width));
    if (widest <= maxW && (lines.length - 1) * pitch + px <= bottom - top) break;
  }
  ctx.fillStyle = style.color;
  let first = style.midBaseline - (pitch * (lines.length - 1)) / 2;
  first = Math.max(first, top + px * 0.8);
  first = Math.min(first, bottom - pitch * (lines.length - 1));
  lines.forEach((t, i) => {
    if (!t) return;
    const w = ctx.measureText(t).width;
    let left = style.align === "left" ? style.anchorX : style.align === "right" ? style.anchorX - w : style.anchorX - w / 2;
    left = Math.min(Math.max(left, margin), c.width - margin - w);
    ctx.fillText(t, left, first + i * pitch);
  });
  return c;
}

// Print-size text is tiny on a phone, so the digital inside scales the whole message up to fill
// most of the page (at most 2x), keeping its font, colour, alignment and relative position.
const ENLARGE_FILL = 0.8, ENLARGE_MAX = 2;
function enlargeText(c) {
  const W = c.width, H = c.height;
  const d = c.getContext("2d").getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0, i = y * W * 4; x < W; x++, i += 4) {
      if (d[i] + d[i + 1] + d[i + 2] > 735) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      y1 = y;
    }
  }
  if (x1 < 0) return c;
  x0 = Math.max(0, x0 - 4); y0 = Math.max(0, y0 - 4); x1 = Math.min(W - 1, x1 + 4); y1 = Math.min(H - 1, y1 + 4);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const k = Math.min(ENLARGE_MAX, (ENLARGE_FILL * W) / bw, (ENLARGE_FILL * H) / bh);
  if (k < 1.05) return c;
  const nw = bw * k, nh = bh * k;
  const left = W > bw ? ((W - nw) * x0) / (W - bw) : 0, top = H > bh ? ((H - nh) * y0) / (H - bh) : 0;
  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(c, x0, y0, bw, bh, left, top, nw, nh);
  return out;
}

// ---------- Build ----------
let infoPromise = null;
const getInfo = () => {
  if (KNOWN_INFO) return Promise.resolve(KNOWN_INFO);
  infoPromise ||= fetch(`${API}/info`).then(async (res) => {
    const info = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(info.error || `Couldn't look up GCU Card# ${PID}.`);
    return info;
  });
  infoPromise.catch(() => { infoPromise = null; });
  return infoPromise;

let builtCard = null;
async function prepare(info) {
  setTitle(info.title);
  if (info.title) document.title = `${info.title} · GCU ${PID}`;

async function buildCard(info) {
  if (info.inside) {
    setStatus("Loading the card…");
    const [front] = await Promise.all([loadImage(info.front), loadImage(API_ORIGIN + info.inside)]);
    return { front: info.front, inside: API_ORIGIN + info.inside, w: front.naturalWidth, h: front.naturalHeight };
  }
  setStatus("Getting the card images…");
  const [front, preview, fontsOk] = await Promise.all([
    loadImage(info.front),
    info.hasPreview ? loadImage(`${API}/preview?cors=1`, true).catch(() => null) : null,
    loadFonts(),
  ]);
  setStatus("Creating the inside page…");
  await new Promise((r) => setTimeout(r, 30));
  const frontLandscape = front.naturalWidth > front.naturalHeight;
  const { canvas, meta, landscape = frontLandscape, style } = renderInside(preview, info.lines || [], frontLandscape);
  if (fontsOk) insideStyle = Promise.resolve(style);
  const blob = await new Promise((r) => enlargeText(canvas).toBlob(r, "image/jpeg", 0.92));
  const q = new URLSearchParams({ w: front.naturalWidth, h: front.naturalHeight, landscape: landscape ? "1" : "0", ...meta });
  // A page drawn with fallback fonts or without the preview is still shown, but not kept for the next visitor.
  if (fontsOk && (preview || !info.hasPreview)) fetch(`${API}/inside?${q}`, { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob }).catch(() => {});
  return { front: info.front, inside: URL.createObjectURL(blob), w: front.naturalWidth, h: front.naturalHeight };
}

// ---------- Envelope reveal (mirrors gcu-inside/animation_template.html) ----------
// CARD.from / CARD.to may change later (the send form previews the sender's names on Replay).
function startAnimation(CARD, { autoPlay = false, onSettled = null, onStep = null, top = "" } = {}) {
  document.documentElement.style.setProperty("--card-cover-width", CARD.w);
  document.documentElement.style.setProperty("--card-cover-height", CARD.h);
  document.body.classList.toggle("is-landscape", CARD.w > CARD.h);
  const frontFace = () => {
    const address = `To ${CARD.to}`;
    const sizeClass = address.length > 34 ? " is-long" : address.length > 22 ? " is-medium" : "";
    return `
    <div class="envelope-front-face">
      <img class="envelope-stamp" src="https://www.card-genie.com/stamp.webp" alt="" aria-hidden="true">
      <span class="envelope-from">From ${esc(CARD.from)}</span>
      <span class="envelope-front-address${sizeClass}">${esc(address)}</span>
    </div>`;
  };
  const placeholder = `<span class="envelope-prompt envelope-prompt-placeholder" aria-hidden="true">Reveal your card</span>`;
  const toggle = (step) => `
    <nav class="card-view-toggle" aria-label="Card view">
      <button class="${step === "front" ? "is-selected" : ""}" data-go="front" type="button">Cover</button>
      <span aria-hidden="true">|</span>
      <button class="${step === "inside" ? "is-selected" : ""}" data-go="inside" type="button">Inside</button>
      <span aria-hidden="true">|</span>${CARD.back ? `
      <button class="${step === "back" ? "is-selected" : ""}" data-go="back" type="button">Back</button>
      <span aria-hidden="true">|</span>` : ""}
      <button data-go="envelope" type="button">Replay</button>
    </nav>`;
  const views = {
    envelope: () => `
      <button class="proof-stage envelope-scene" type="button" data-go="envelopeFlip">
        <div class="envelope">${frontFace()}</div>
        <span class="envelope-prompt">Reveal your card</span>
      </button>`,
    envelopeFlip: () => `
      <div class="proof-stage envelope-scene">
        <div class="envelope is-flipping">
          ${frontFace()}
          <div class="envelope-back-face">
            <div class="envelope-back"></div><div class="envelope-liner"></div>
            <div class="envelope-flap envelope-flap-static"></div><div class="envelope-body"></div>
          </div>
        </div>${placeholder}
      </div>`,
    envelopeBack: (opening = false) => `
      <div class="proof-stage envelope-scene${opening ? " opening-scene" : ""}">
        <div class="opening-stack">
          <div class="envelope envelope-static${opening ? " is-opening" : ""}">
            <div class="envelope-back-face is-static"><div class="envelope-back"></div><div class="envelope-body"></div></div>
            <div class="envelope-liner"></div>
            <div class="envelope-flap${opening ? "" : " envelope-flap-static"}"></div>
          </div>
          ${opening ? `<div class="card-sleeve"><div class="sleeve-card"><img src="${CARD.front}" alt="Card front"></div></div>
                       <div class="envelope-pocket"></div>` : ""}
        </div>${placeholder}
      </div>`,
    opening: () => views.envelopeBack(true),
    front: (fromEnvelope) => `
      <button class="proof-stage card-reveal front-reveal" type="button" data-go="inside">
        <div class="card-cover-frame${fromEnvelope ? "" : " is-return"}"><img src="${CARD.front}" alt="Card front"></div>
      </button>${toggle("front")}`,
    inside: () => `
      <button class="proof-stage card-open-scene is-static-inside" type="button" data-go="front">
        <div class="open-card"><img src="${CARD.inside}" alt="Card inside"></div>
      </button>${toggle("inside")}`,
    back: () => `
      <button class="proof-stage card-reveal front-reveal" type="button" data-go="front">
        <div class="card-cover-frame is-return"><img src="${CARD.back}" alt="Card back"></div>
      </button>${toggle("back")}`,
  };
  if (CARD.back) new Image().src = CARD.back;

  // Copy of the opening scene frozen at its last frame, so the envelope can fade out while the
  // card glides to its resting spot.
  function frozenCopy(scene, skip) {
    const copy = scene.cloneNode(true);
    const src = [scene, ...scene.querySelectorAll("*")];
    const dst = [copy, ...copy.querySelectorAll("*")];
    src.forEach((el, i) => {
      const cs = getComputedStyle(el);
      Object.assign(dst[i].style, { animation: "none", transform: cs.transform, opacity: cs.opacity, clipPath: cs.clipPath });
    });
    copy.querySelectorAll(skip).forEach((el) => el.remove());
    copy.classList.add("envelope-ghost");
    return copy;
  }

  const timers = [];
  function go(step, fromEnvelope = false) {
    if (step === "envelope") timers.splice(0).forEach(clearTimeout);
    const settle = step === "front" && fromEnvelope && stage.querySelector(".sleeve-card");
    let cardWas, sceneWas, ghost;
    if (settle) {
      cardWas = stage.querySelector(".sleeve-card").getBoundingClientRect();
      const scene = stage.querySelector(".proof-stage");
      sceneWas = scene.getBoundingClientRect();
      ghost = frozenCopy(scene, ".card-sleeve");
    }
    stage.innerHTML = top + views[step](fromEnvelope && !settle);
    if (settle) {
      const frame = stage.querySelector(".card-cover-frame");
      const now = frame.getBoundingClientRect();
      const box = stage.getBoundingClientRect();
      Object.assign(ghost.style, {
        left: `${sceneWas.left - box.left}px`, top: `${sceneWas.top - box.top}px`,
        width: `${sceneWas.width}px`, height: `${sceneWas.height}px`,
      });
      stage.appendChild(ghost);
      Object.assign(frame.style, { zIndex: 2, transformOrigin: "top left" });
      frame.animate([
        { transform: `translate(${cardWas.left - now.left}px, ${cardWas.top - now.top}px) scale(${cardWas.width / now.width})` },
        { transform: "none" },
      ], { duration: 1100, easing: "cubic-bezier(0.3, 0.8, 0.25, 1)" });
      ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, easing: "ease", fill: "forwards" })
        .finished.then(() => ghost.remove());
      stage.querySelector(".card-view-toggle")
        ?.animate([{ opacity: 0 }, { opacity: 0, offset: 0.6 }, { opacity: 1 }], { duration: 1100 });
    }
    if (step === "envelopeFlip") timers.push(setTimeout(() => go("envelopeBack"), 1200));
    if (step === "envelopeBack") timers.push(setTimeout(() => go("opening"), 350));
    if (step === "opening") timers.push(setTimeout(() => go("front", true), 4600));
    if (step === "front" && fromEnvelope && onSettled) { const done = onSettled; onSettled = null; done(); }
    onStep?.(step);
  }
  stage.onclick = (e) => {
    if (e.target.closest("[data-back]")) { timers.splice(0).forEach(clearTimeout); backToProduct(); return; }
    const el = e.target.closest("[data-go]");
    if (el && !el.disabled) go(el.dataset.go);
  };
  stopAnimation = () => timers.splice(0).forEach(clearTimeout);
  showCardInside = () => {
    const img = stage.querySelector(".open-card img");
    if (img) img.src = CARD.inside;
    else { timers.splice(0).forEach(clearTimeout); go("inside"); }
  };
  go("envelope");
  if (autoPlay) timers.push(setTimeout(() => go("envelopeFlip"), 1100));
}

let productInfo = null;
const tabCache = {};
function renderProduct() {
  stopAnimation();
  const info = productInfo;
  document.body.classList.add("product-mode");
  document.documentElement.classList.add("product-mode");
  document.body.classList.remove("is-landscape");
  after.innerHTML = "";
  if (info.title) document.title = `${info.title} (${PID})`;
  const prev = previouslyViewed(info);
  stage.innerHTML = `<div class="gcu-d">${desktopView(info, prev)}</div><div class="gcu-m">${mobileView(info)}</div>`;
  const views = cardViews(info);
  stage.onclick = async (e) => {
    if (e.target.closest("[data-send]")) return startSendFlow();
    const go = e.target.closest("button[data-href]");
    if (go) return void (location.href = go.dataset.href);
    const view = e.target.closest("[data-view]");
    if (view) {
      e.preventDefault();
      const img = stage.querySelector("#image1");
      img.src = views[view.dataset.view];
      img.classList.toggle("gcu-flat", view.dataset.view !== "front" || !info.image3d);
      return;
    }
    const mview = e.target.closest("[data-mview]");
    if (mview) {
      e.preventDefault();
      const want = mview.dataset.mview;
      const box = stage.querySelector(".gcu-m-views");
      box.querySelectorAll("[data-mview]").forEach((el) => {
        const k = el.dataset.mview, label = el.textContent;
        el.outerHTML = k === want ? `<b data-mview="${k}">${label}</b>` : `<a href="#" data-mview="${k}">${label}</a>`;
      });
      stage.querySelectorAll("[data-mpane]").forEach((p) => { p.style.display = p.dataset.mpane === want ? "" : "none"; });
      return;
    }
    const tab = e.target.closest("[data-tab]");
    if (tab && tab.classList.contains("inactiveTab")) {
      stage.querySelectorAll("[data-tab]").forEach((t) => {
        t.classList.toggle("activeTab", t === tab);
        t.classList.toggle("inactiveTab", t !== tab);
      });
      let pane = null;
      stage.querySelectorAll("[data-tabc]").forEach((c) => {
        const on = c.dataset.tabc === tab.dataset.tab;
        c.classList.toggle("activeTabC", on);
        c.classList.toggle("inactiveTabC", !on);
        c.style.position = on ? "static" : "absolute";
        if (on) pane = c;
      });
      if (pane && pane.dataset.num && !pane.dataset.loaded) {
        pane.dataset.loaded = "1";
        const key = `${pane.dataset.num}:${isLandscape(info) ? "l" : "p"}`;
        try {
          tabCache[key] ||= fetch(`${API}/tab/${pane.dataset.num}?o=${isLandscape(info) ? "l" : "p"}`).then((r) => (r.ok ? r.text() : Promise.reject(new Error("tab"))));
          pane.innerHTML = await tabCache[key];
        } catch {
          delete tabCache[key];
          pane.dataset.loaded = "";
          pane.innerHTML = `<p>Couldn’t load this tab. <a href="${esc(info.productUrl || `${G}/${PID}`)}">See it on GreetingCardUniverse</a>.</p>`;
        }
      }
    }
  };
}

function productLoading(message, error = false) {
  document.documentElement.classList.remove("product-mode");

}

// ---------- Sender: build + play, then the send form ----------
let sendCard = null;
// The send flow is its own history step, so the browser's Back button returns to the card details.
let inSendStep = false;
const backToProduct = () => (inSendStep ? history.back() : renderProduct());
window.addEventListener("popstate", () => {
  if (!inSendStep) return;
  inSendStep = false;
  renderProduct();
});
async function startSendFlow() {
  if (!inSendStep) {
    history.pushState({ ...(history.state || {}), gcuStep: "send" }, "");
    inSendStep = true;
  }
  window.scrollTo(0, 0);
  showLoader(`Creating animation for GCU Card# ${PID}`, productInfo.title);
  try {
    const card = await prepare(productInfo);
    if (!edit.original && !edit.blob) {
      edit.original = normalizeMessage((productInfo.lines || []).join("\n"));
      edit.message = edit.original;
    }
    sendCard = { ...card, originalInside: card.inside, inside: edit.blob ? edit.url : card.inside, to: "You", from: "Greeting Card Universe" };
    after.innerHTML = "";
    startAnimation(sendCard, {
      autoPlay: true,
      top: `<button class="gcu-back" type="button" data-back>‹ Back to card details</button>`,
      onSettled: showSendForm,
    });
  } catch (err) {
    setStatus(err.message || "Something went wrong.", true);
    stage.querySelector(".gcu-loading")?.insertAdjacentHTML("afterbegin", `<button class="gcu-back" type="button" data-back>‹ Back to card details</button>`);
    stage.onclick = (e) => { if (e.target.closest("[data-back]")) backToProduct(); };
  }
}

const SESSION_KEY = "cardGenieAccountSession";
const CREDITS_KEY = "cardGenieCredits";
const readSession = () => {
  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); return s?.token && s?.phoneE164 ? s : null; } catch { return null; }
};
const formatPhone = (e164) => {
  const d = String(e164 || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : e164;
};
const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const phoneDigits = (v) => { const d = String(v).replace(/\D/g, ""); return d.length === 11 && d[0] === "1" ? d.slice(1) : d; };
const postJson = async (path, body, token) => {
  const res = await fetch(`${API_ORIGIN}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
};

// GCU sends can only use purchased credits; form.credits is that number, form.total the whole balance.
const applyCredits = (data) => {
  if (typeof data.paidCreditBalance === "number") form.credits = data.paidCreditBalance;
  if (typeof data.creditBalance === "number") { form.total = data.creditBalance; localStorage.setItem(CREDITS_KEY, String(data.creditBalance)); }
};

const normalizeMessage = (s) => s.replace(/\r/g, "").split("\n").map((l) => l.replace(/\s+/g, " ").trim()).join("\n").trim();
// The sender's edits to the inside message; kept while they stay on this card.

        <div class="msg-fields" ${edit.open ? "" : "hidden"}>
          <label><span>Message inside the card</span><textarea id="msgText" rows="5" maxlength="${MAX_MESSAGE_CHARS}"></textarea></label>
          <label><span>Sign it <small>(optional)</small></span><input id="msgSig" maxlength="60" autocomplete="off" placeholder="Love, Alex"></label>
          <p class="msg-actions"><span class="msg-status" id="msgStatus" aria-live="polite"></span><button type="button" class="link-btn" data-reset-msg>Reset to original</button></p>
        </div>
      </div>
      <div class="send-method" role="radiogroup" aria-label="Send by">
        <button type="button" role="radio" data-method="email">Email</button>
        <button type="button" role="radio" data-method="text">Text message</button>
      </div>
      <div class="send-row">
        <label><span>To <small>(their name, optional)</small></span><input id="sendTo" maxlength="40" autocomplete="off" placeholder="Jamie"></label>
        <label><span>From <small>(your name)</small></span><input id="sendFrom" maxlength="40" autocomplete="name" placeholder="Alex"></label>
      </div>
      <label><span data-dest-label>Their email</span><input id="sendDest" autocomplete="off"></label>
      <label class="sms-consent" hidden>
        <input type="checkbox" id="sendConsent">
        <span>OK to text them this card — one message, no marketing. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help.
          <a href="${esc(APP_URL)}/privacy/index.html" target="_blank" rel="noopener">Privacy</a> · <a href="${esc(APP_URL)}/terms/index.html" target="_blank" rel="noopener">Terms</a></span>
      </label>
      <div class="send-account" id="sendAccount"></div>
      <p class="send-notice" id="sendNotice" role="alert"></p>
      <button class="send-submit" type="button" id="sendSubmit">Send card</button>
      <p class="send-cost">${SEND_COST} GCU Credits to Send</p>
    </section>`;
  const $ = (s) => after.querySelector(s);
  const notice = (t, ok = false) => { const n = $("#sendNotice"); n.textContent = t; n.classList.toggle("is-ok", ok); };
  const setMethod = (m) => {
    form.method = m;
    after.querySelectorAll("[data-method]").forEach((b) => { const on = b.dataset.method === m; b.classList.toggle("is-selected", on); b.setAttribute("aria-checked", on); });
    const dest = $("#sendDest");
    $("[data-dest-label]").textContent = m === "email" ? "Their email" : "Their cellphone";
    Object.assign(dest, m === "email"
      ? { type: "email", inputMode: "email", placeholder: "jamie@example.com", autocomplete: "off" }
      : { type: "tel", inputMode: "tel", placeholder: "(925) 555-1234", autocomplete: "off" });
    $(".sms-consent").hidden = m !== "text";
    notice("");
  };
  const renderAccount = () => {
    const box = $("#sendAccount");
    if (form.session) {
      const credits = form.credits == null ? "" : `${form.credits} GCU credit${form.credits === 1 ? "" : "s"} in account`;
      const low = form.credits != null && form.credits < SEND_COST;
      const freeOnly = form.total != null && form.credits != null && form.total > form.credits;
      box.innerHTML = `<p class="ok"><span class="check" aria-hidden="true">✓</span>Phone confirmed: ${esc(formatPhone(form.session.phoneE164))}</p>
        ${credits ? `<p class="credits">${esc(credits)}</p>` : ""}
        ${freeOnly ? `<p class="credits credits-note">Free credits can’t be used for Greeting Card Universe cards.</p>` : ""}
        ${low ? `<p style="margin:6px 0 0">You need ${SEND_COST} credits to send. <a href="${esc(APP_URL)}/" target="_blank" rel="noopener">Buy credits</a>, then come back and tap Send.</p>` : ""}
        <p class="account-links"><a href="${esc(APP_URL)}/?account=1" target="_blank" rel="noopener">My account</a><span aria-hidden="true"> · </span><button type="button" data-sign-out>Sign out</button></p>`;
      return;
    }
    box.innerHTML = `
      <p>Confirm your mobile number to send. We’ll text a one-time code.</p>
      <div class="code-row">
        <label>Mobile number<input id="acctPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(925) 555-1234"></label>
        <button class="send-secondary" type="button" data-code-start ${form.busy === "start" ? "disabled" : ""}>${form.busy === "start" ? "Sending code…" : form.codeSent ? "Text a new code" : "Text me a code"}</button>
      </div>
      ${form.codeSent ? `<div class="code-row" style="margin-top:8px">
        <label>Text code<input id="acctCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" maxlength="8"></label>
        <button class="send-secondary" type="button" data-code-verify ${form.busy === "verify" ? "disabled" : ""}>${form.busy === "verify" ? "Checking…" : "Confirm number"}</button>
      </div>` : ""}`;
    if (form.phone) $("#acctPhone").value = form.phone;
  };
  const signOut = () => {
    const token = form.session?.token;
    if (token) fetch(`${API_ORIGIN}/api/auth/logout`, { method: "POST", headers: { Authorization: `Bearer ${token}` }, keepalive: true }).catch(() => {});
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(CREDITS_KEY);
    Object.assign(form, { session: null, credits: null, total: null, codeSent: false, phone: "" });
    notice("");
    renderAccount();
  };
  const refreshAccount = async () => {
    if (!form.session) return renderAccount();
    renderAccount();
    try {
      const res = await fetch(`${API_ORIGIN}/api/account`, { headers: { Authorization: `Bearer ${form.session.token}` } });
      if (res.status === 401) { localStorage.removeItem(SESSION_KEY); form.session = null; return renderAccount(); }
      const data = await res.json().catch(() => ({}));
      applyCredits(data);
    } catch {}
    renderAccount();
  };
  const startCode = async () => {
    form.phone = $("#acctPhone").value.trim();
    if (phoneDigits(form.phone).length !== 10) return notice("Enter your 10-digit mobile number, like (925) 555-1234.");
    form.busy = "start"; renderAccount(); notice("");
    try {
      const { res, data } = await postJson("/api/auth/otp/start", { phone: form.phone });
      if (!res.ok) throw new Error(data.error || "Couldn’t send a code. Try again.");
      form.codeSent = true; notice(data.message || "We texted you a 6-digit code.", true);
    } catch (err) { notice(err.message); }
    form.busy = ""; renderAccount();
    $("#acctCode")?.focus();
  };
  const verifyCode = async () => {
    const code = ($("#acctCode")?.value || "").replace(/\D/g, "");
    if (code.length !== 6) return notice("Enter the 6-digit code from the text message.");
    form.busy = "verify"; renderAccount(); notice("");
    try {
      const { res, data } = await postJson("/api/auth/otp/verify", { phone: form.phone, code, source: "gcu" });
      if (!res.ok || !data.token) throw new Error(data.error || "That code didn’t work. Try again.");
      form.session = { token: data.token, phoneE164: data.phoneE164, copyEmail: data.email || undefined };
      localStorage.setItem(SESSION_KEY, JSON.stringify(form.session));
      applyCredits(data);
      notice(data.message || "Your number is confirmed.", true);
    } catch (err) { notice(err.message); }
    form.busy = ""; renderAccount();
  };
  const submit = async () => {
    const method = form.method;
    const destRaw = $("#sendDest").value.trim();
    const fromName = $("#sendFrom").value.trim();
    const toName = $("#sendTo").value.trim();
    if (method === "email" && !validEmail(destRaw)) return notice("Enter their email address, like jamie@example.com.");
    if (method === "text" && phoneDigits(destRaw).length !== 10) return notice("Enter their 10-digit US cellphone number, like (925) 555-1234.");
    if (!fromName) return notice("Enter your name so they know who it’s from.");
    if (method === "text" && !$("#sendConsent").checked) return notice("Check the box to send this card by text.");
    if (!form.session) return notice("Confirm your mobile number before sending. We’ll text you a one-time code.");
    if (form.credits != null && form.credits < SEND_COST) return notice(`Sending uses ${SEND_COST} credits and you have ${form.credits}. Buy more credits to send.`);
    const btn = $("#sendSubmit");
    btn.disabled = true;
    btn.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>Sending…`;
    notice("");
    try {
      await edit.pending;
      const inside = edit.blob ? await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error("Couldn’t prepare your message. Please try again."));
        r.readAsDataURL(edit.blob);
      }) : undefined;
      const { res, data } = await postJson(`/gcu/${PID}/send`, {
        method, destination: destRaw, fromName, toName, recipientConsentConfirmed: method === "text" ? true : undefined,
        ...(inside ? { inside, message: edit.message, signature: edit.signature } : {}),
      }, form.session.token);
      applyCredits(data);
      if (res.status === 401) { localStorage.removeItem(SESSION_KEY); form.session = null; renderAccount(); }
      if (!res.ok) { renderAccount(); throw new Error(data.error || "Couldn’t send the card. Please try again."); }
      const shown = method === "email" ? data.deliveredTo : formatPhone(data.deliveredTo);
      after.innerHTML = `
        <section class="send-panel send-done" aria-live="polite">
          <div class="big" aria-hidden="true">💌</div>
          <h2>Card sent!</h2>
          <p class="send-sub">We ${method === "email" ? "emailed" : "texted"} ${esc(shown)} a link to open it. ${SEND_COST} GCU credits used${typeof data.paidCreditBalance === "number" ? ` · ${data.paidCreditBalance} left` : ""}.</p>
          <p><a href="${esc(data.shareUrl)}" target="_blank" rel="noopener">${esc(data.shareUrl)}</a></p>
          <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
            <button class="send-secondary" type="button" data-again>Send to someone else</button>
            <button class="send-secondary" type="button" data-back-product>Back to card details</button>
          </p>
        </section>`;
      return;
    } catch (err) {
      notice(err.message);
      btn.disabled = false;
      btn.textContent = "Send card";
    }
  };
  const previewNames = () => {
    sendCard.from = $("#sendFrom").value.trim() || "Greeting Card Universe";
    sendCard.to = $("#sendTo").value.trim() || "You";
  };
  const msgStatus = (t) => { $("#msgStatus").textContent = t; };
  const redraw = () => {
    const seq = ++edit.seq;
    edit.message = $("#msgText").value;
    edit.signature = $("#msgSig").value;
    const custom = normalizeMessage(edit.message) !== edit.original || edit.signature.trim();
    edit.pending = (async () => {
      if (!custom) {
        edit.blob = null;
        sendCard.inside = sendCard.originalInside;
        msgStatus("");
        return showCardInside();
      }
      const style = await getInsideStyle(productInfo);
      if (seq !== edit.seq) return;
      const blob = await new Promise((r) => enlargeText(renderCustom(style, edit.message, edit.signature)).toBlob(r, "image/jpeg", 0.9));
      if (seq !== edit.seq) return;
      if (edit.url) URL.revokeObjectURL(edit.url);
      edit.blob = blob;
      edit.url = URL.createObjectURL(blob);
      sendCard.inside = edit.url;
      msgStatus("Tap Replay to preview it in the envelope.");
      showCardInside();
    })().catch(() => msgStatus("Couldn’t update the preview. Try again."));
  };
  let redrawTimer = 0;
  const scheduleRedraw = () => { clearTimeout(redrawTimer); redrawTimer = setTimeout(redraw, 150); };
  const openEditor = async () => {
    edit.open = true;
    $("[data-edit-msg]").hidden = true;
    $(".msg-fields").hidden = false;
    showCardInside();
    if (!edit.blob) msgStatus("Loading the card’s lettering…");
    try { await getInsideStyle(productInfo); } catch {}
    if (!edit.blob) msgStatus("");
    $("#msgText").focus();
  };
  $("#msgText").value = edit.message;
  $("#msgSig").value = edit.signature;
  after.onclick = (e) => {
    const m = e.target.closest("[data-method]");
    if (m) return setMethod(m.dataset.method);
    if (e.target.closest("[data-edit-msg]")) return openEditor();
    if (e.target.closest("[data-reset-msg]")) {
      $("#msgText").value = edit.original;
      $("#msgSig").value = "";
      return redraw();
    }
    if (e.target.closest("[data-code-start]")) return startCode();
    if (e.target.closest("[data-code-verify]")) return verifyCode();
    if (e.target.closest("[data-sign-out]")) return signOut();
    if (e.target.closest("#sendSubmit")) return submit();
    if (e.target.closest("[data-again]")) { after.innerHTML = ""; return showSendForm(); }
    if (e.target.closest("[data-back-product]")) return backToProduct();
  };
  after.oninput = (e) => {
    if (e.target.id === "sendFrom" || e.target.id === "sendTo") previewNames();
    if (e.target.id === "msgText" || e.target.id === "msgSig") scheduleRedraw();
  };
  setMethod(form.method);
  refreshAccount();
}

// ---------- Recipient: open the card that was sent ----------
async function openGift() {
  showLoader("Opening your card…", "");
  try {
    const [info, gift] = await Promise.all([
      getInfo(),
      fetch(`${API}/gift/${GIFT_ID}`).then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "This card link isn’t working."); return d; }),
    ]);
    const heading = stage.querySelector(".gcu-loading h1");
    if (heading) heading.textContent = `Opening your card from ${gift.from}…`;
    const card = { ...(await prepare(info)) };
    if (gift.inside) {
      card.inside = API_ORIGIN + gift.inside;
      await loadImage(card.inside).catch(() => {});
    }
    const productUrl = info.productUrl || `${G}/${PID}`;
    const footer = `<p class="gcu-footer">Sent with <a href="${G}/" target="_blank" rel="noopener">Greeting Card Universe</a> · GCU Card# ${esc(PID)}</p>`;
    const note = gift.note ? `<section class="gift-note"><h2>A note from ${esc(gift.from)}</h2><p>${esc(gift.note)}</p></section>` : "";
    // Like Card Genie's keepsake offer: shown once they've opened the card to the inside.
    const buyPanel = `
      <section class="gift-buy" aria-labelledby="buyTitle">
        <span class="gift-buy-kicker">Want this card mailed to you?</span>
        <h2 id="buyTitle">${info.price ? `Get it printed for ${esc(money(info.price))}` : "Get it printed"}</h2>
        <p>Greeting Card Universe prints this card on premium cardstock and mails it to you or anyone you choose, <span class="nowrap">next business day.</span></p>
        <a class="gift-buy-btn" href="${esc(addToCartUrl(PID))}">Buy this card${info.price ? ` · ${esc(money(info.price))}` : ""}</a>
        <p class="gift-buy-links"><a href="${esc(personalizeUrl(PID))}">Personalize the inside &amp; buy</a><br><a href="${esc(productUrl)}">See card details</a></p>
        <p class="gift-buy-fine">You can fully personalize the inside message.</p>
      </section>`;
    let offered = false;
    startAnimation({ ...card, from: gift.from, to: gift.to || "You" }, {
      onSettled: () => { after.innerHTML = note + footer; },
      onStep: (step) => {
        if (step !== "inside" || offered) return;
        offered = true;
        after.innerHTML = note + buyPanel + footer;
      },
    });
  } catch (err) {
    setStatus(err.message || "Something went wrong.", true);
  }
}

if (GIFT_ID) {
  openGift();
} else if (KNOWN_INFO) {
  productInfo = KNOWN_INFO;
  renderProduct();
} else {
  productLoading(`Loading GCU Card# ${PID}…`);
  getInfo()
    .then((info) => { productInfo = info; renderProduct(); })
    .catch((err) => productLoading(err.message || "Something went wrong.", true));
}
</script>
</body>
</html>
