name = "cardgenie-api"
main = "worker/index.js"
compatibility_date = "2026-05-20"
workers_dev = true

[vars]
OPENAI_TEXT_MODEL = "gpt-4o-mini"
OPENAI_IMAGE_MODEL = "gpt-image-2"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://card-genie.com,https://www.card-genie.com"
PUBLIC_APP_URL = "https://www.card-genie.com"
SHARE_BASE_URL = "https://www.card-genie.com"

[[routes]]
pattern = "www.card-genie.com/c/*"
zone_name = "card-genie.com"

[[routes]]
pattern = "card-genie.com/c/*"
zone_name = "card-genie.com"

[[kv_namespaces]]
binding = "CARD_STORE"
id = "e599b5d8c31b4d5296a7d4c8e7a8aef0"
