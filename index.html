    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.card-genie.com/#org",
            "name": "Card Genie",
            "url": "https://www.card-genie.com/",
            "logo": "https://www.card-genie.com/logo.png",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "154 East Prospect Avenue, Suite B",
              "addressLocality": "Danville",
              "addressRegion": "CA",
              "postalCode": "94526",
              "addressCountry": "US"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.card-genie.com/#website",
            "name": "Card Genie",
            "url": "https://www.card-genie.com/",
            "publisher": { "@id": "https://www.card-genie.com/#org" }
          }
        ]
      }
    </script>
    <script>
      // Personal card links and unknown paths all load this page; keep them out of search results.
      ;(function () {
        var path = location.pathname
        var personal = /^\/c\//.test(path) || /[?&](card|resume)=/.test(location.search)
        var known = path === '/' || path === '/index.html' || /^\/gcu\//i.test(path)
        if (personal || !known) {
          var meta = document.createElement('meta')
          meta.name = 'robots'
          meta.content = 'noindex'
          document.head.appendChild(meta)
        }
      })()
    </script>
    <script>
      // Keep everyone on www so sign-ins and saved drafts live under one origin.
      if (location.hostname === 'card-genie.com') {
        location.replace('https://www.card-genie.com' + location.pathname + location.search + location.hash)
      }
    </script>
    <script>
      // Fallback when /gcu/<card#> reaches the SPA instead of the Pages function;
      // swap in the GCU animation page the API serves, keeping this URL.
      ;(function () {
        var m = location.pathname.match(/^\/gcu\/0*(\d{1,10})\/?$/i)
        if (!m) return
        window.__gcuTakeover = true
        var api = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8787' : 'https://api.card-genie.com'
        fetch(api + '/gcu/' + m[1])
          .then(function (r) { return r.text() })
          .then(function (html) { document.open(); document.write(html); document.close() })
          .catch(function () { location.replace(api + '/gcu/' + m[1]) })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
