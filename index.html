<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>Card Genie</title>
    <meta name="description" content="Personalized greeting cards, made with a little magic." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Card Genie" />
    <meta property="og:title" content="Card Genie" />
    <meta property="og:description" content="Personalized greeting cards, made with a little magic." />
    <meta property="og:url" content="https://www.card-genie.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Card Genie" />
    <meta name="twitter:description" content="Personalized greeting cards, made with a little magic." />
    <script>
      // www.card-genie.com is served by GitHub Pages, so /gcu/<card#> lands here (via 404.html);
      // swap in the GCU animation page the API serves, keeping this URL.
      ;(function () {
        var m = location.pathname.match(/^\/gcu\/0*(\d{1,10})\/?$/i)
        if (!m) return
        window.__gcuTakeover = true
        var api = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8787' : 'https://api.card-genie.com'
        fetch(api + '/gcu/' + m[1])
          .then(function (r) { return r.text() })
          .then(function (html) { document.open(); document.write(html); document.close() })
          .catch(function () { location.replace(api + '/gcu/' + m[1]) })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
